const POSTS = {
  'ruffle-vs-flashpoint': {
    title: 'Ruffle vs. Flashpoint: the two ways Flash games survive without Flash Player',
    date: 'AUG 29, 2026',
    excerpt: 'Adobe Flash Player has been gone since January 2021. Here\'s how two very different preservation projects kept the games it ran playable anyway, and why neither one is the actual bottleneck for this site.',
    html: `
      <p>Adobe Flash Player stopped running anywhere the moment every major browser pulled its plugin
      support in January 2021, three years after Adobe first announced Flash's end of life in 2017. That
      killed the plugin, not the roughly two decades of games built on top of it, and since then two
      genuinely different projects have grown up to keep that library playable, solving the same problem
      in close to opposite ways.</p>
      <p><a href="https://ruffle.rs" target="_blank" rel="noopener">Ruffle</a>, the project the loader in
      our own player is built around, rebuilds Flash Player from scratch instead of preserving it. Mike
      Welsh, previously of Newgrounds, started it in 2016 under the name "Fluster"; it's since grown into
      an MIT/Apache-licensed emulator written in Rust and compiled to WebAssembly, re-implementing the
      ActionScript language and Flash runtime as its own independent piece of sandboxed software rather
      than running Adobe's actual player, which no longer exists in any form a modern browser will load.
      Rebuilding instead of preserving means coverage isn't total, and doesn't need to be: Ruffle's own <a
      href="https://ruffle.rs/compatibility" target="_blank" rel="noopener">compatibility page</a> puts
      AVM1 content (ActionScript 1/2, most pre-2013 Flash) at 99% language and 82% API coverage, with AVM2
      (ActionScript 3, the newer standard most later Flash used) close behind. That's been enough for
      Newgrounds, Internet Archive, Armor Games, Coolmath Games, and Homestar Runner to run their legacy
      Flash catalogs through it today, live in a normal tab, no plugin involved.</p>
      <p><a href="https://flashpointarchive.org" target="_blank" rel="noopener">Flashpoint Archive</a>
      takes the opposite approach. Started in late 2017 by Australian developer Ben "BlueMaxima" Latimore,
      it preserves the actual original plugins instead of reimplementing them: real Flash Player, plus
      Shockwave, Silverlight, Java applets, Unity Web Player, and well over a hundred other dead browser
      technologies, run inside a sandboxed local environment with a proxy server standing in for the
      internet requests those old games used to make and can no longer complete. It's less accessible, a
      downloaded application rather than a click-to-play tab, but more complete in a way emulation can't
      fully match: whatever the original plugin actually did, Flashpoint replays exactly, quirks and bugs
      included. The archive currently holds over 200,000 preserved applications at 1.68 terabytes, with
      its latest release out in November 2025.</p>
      <p>Neither approach is the actual bottleneck for a site like this one, though, and it has nothing to
      do with technology. As we <a href="blog-post.html?slug=why-no-flash-yet">explained recently</a>, the
      barrier isn't whether Ruffle can run a Flash game well enough, it plainly can, it's finding one with
      a real, checkable open license behind it, the same bar every HTML5 game in this vault already had to
      clear. Most of what both of these projects preserve was built for ad-funded portals or studios that
      never released the rights, which is exactly why it needed a preservation project instead of just
      staying live on its original site. The day a genuinely open-licensed exception turns up, the loader
      is already built and waiting. Know of one? <a href="submit.html">The submission form</a> is open.</p>
    `
  },
  'why-no-flash-yet': {
    title: 'Why there\'s no Flash in the vault yet',
    date: 'AUG 29, 2026',
    excerpt: 'The homepage has promised Flash-era classics revived with Ruffle since launch. Here\'s the honest reason none have shipped, and what it would actually take.',
    html: `
      <p>Sharp-eyed visitors have pointed out something true: this site has said "Flash era classics
      revived with Ruffle" since the day it launched, and the vault has never once contained an actual
      Flash game. All 34 titles here are HTML5. That's not a bait and switch we're comfortable leaving
      unexplained, so here's the real reason.</p>
      <p>It comes down to the same rule that governs every other game on this site: we only ship what we
      can point at a genuine, checkable open license for, on the actual source file, not a repo's root
      LICENSE or a listing site's badge. That bar has been easy to clear for HTML5. The last fifteen years
      produced a large, healthy population of small indie browser games released under MIT or CC0 by
      developers who wanted their code read and reused, and that's who most of this catalog comes from.
      Flash never really had that culture. The SWFs most people remember as "Flash classics" were built
      for ad-supported portals or commercial studios, and the ones that got dumped onto ROM-style archive
      sites after Flash Player's death are sitting there because they were popular, not because anyone
      ever released the rights. A Flash game with a real, verifiable open license from its actual author
      is a genuinely rare find, rarer than the equivalent HTML5 search.</p>
      <p>Ruffle itself is not the blocker. Its own <a href="https://ruffle.rs/compatibility"
      target="_blank" rel="noopener">compatibility page</a> currently reports 99% language and 82% API
      coverage for AVM1 content (pre-2013, most of the era people are nostalgic for) and 90% language /
      82% API coverage for AVM2, and calls that good enough for most games to be playable. If we had a
      legitimately open-licensed SWF sitting on the shelf, embedding it would be the easy part.</p>
      <p>So the plan hasn't changed, just the timeline: the Ruffle loader has been built into the player
      since launch and is sitting there unused, <a href="submit.html">the submission form</a> already
      lists SWF as an option, and the day a Flash game turns up with the same kind of paper trail every
      HTML5 game here already has, it goes in the vault like everything else. Until then, the front page
      copy should say what's actually true, so it now does.</p>
    `
  },
  'six-new-games-and-a-few-that-didnt-make-it': {
    title: 'Six new games join the vault, a few with a mind of their own',
    date: 'AUG 13, 2026',
    excerpt: 'InvaderZ, Genius, Googol, JoKenPo, BangBang, and IsoCity, plus the honest list of what got rejected this round and why.',
    html: `
      <p>This batch came from one place: the back catalog of Victor Ribeiro (victorqribeiro on GitHub), an
      indie developer who has spent years building small, self-contained browser games, a lot of them
      pairing a classic arcade format with a genuinely simple machine learning idea instead of a scripted
      difficulty curve. All six are MIT licensed, and we went through the same process as every batch
      before this one: check the actual header of the actual source file, not just whatever's sitting in
      the repo's root LICENSE, and look hard at every image and audio asset before it ships.</p>
      <p><a href="game.html?id=invaderz">InvaderZ</a> is Space Invaders with a real genetic algorithm
      running underneath it: invaders that survive a wave breed into the next generation's population, so
      a sloppy clear actually makes the next wave harder to read, not just faster. <a
      href="game.html?id=genius">Genius</a> is a Simon-style memory game that lets you layer color, sound,
      letters, numbers, and directions on top of each other, built around the idea that people genuinely
      encode sequences differently. <a href="game.html?id=googol">Googol</a> is a playable version of the
      secretary problem, the classic optimal-stopping puzzle from decision theory, dressed up as a
      pick-a-number game with a "Computer" button that plays the mathematically optimal strategy for you.
      <a href="game.html?id=jokenpo">JoKenPo</a> and <a href="game.html?id=bangbang">BangBang</a> both pit
      you against a small neural network trained live during your match, rock-paper-scissors and artillery
      dueling respectively, so the opponent starts every game knowing nothing about you and gets better at
      reading your habits the longer you play predictably. <a href="game.html?id=isocity">IsoCity</a> is
      the odd one out: no goal, no score, no failure state, just an isometric grid and a tile palette,
      using CC0 tile art from Kenney.nl, credited here even though that license doesn't require it.</p>
      <p>Getting these five self-sizing games (everything except InvaderZ) to actually display correctly
      turned up a real bug worth naming: none of them set an explicit background color, relying on a
      plain browser default that happens to be white on a normal tab. Inside our black player frame, that
      default rendered as transparent instead, which meant black text and black-outlined icons on top of
      our own black background, completely invisible. Fixed by giving each one an explicit white
      background in its own CSS.</p>
      <p>Five other candidates from the same sweep did not make it in, and it's worth explaining why rather
      than just skipping them. A driving game's car sprite turned out to be a real photographed
      Mercedes-Maybach, not original artwork, badge and all, not something an MIT code license covers. A
      tower defense game was marked unfinished by its own README and shipped with a dozen third-party
      music and sound effect files we'd have needed to individually trace and credit for a WIP we weren't
      confident about featuring. A shooter had a single sound effect with no credited source anywhere in
      the repo. A number-ordering puzzle turned out to be mechanically identical to the 15 Puzzle already
      in the vault, just on a smaller grid. And a solitaire implementation required a React and yarn build
      pipeline that doesn't fit how every other game here ships: plain files, no build step. See <a
      href="blog-post.html?slug=how-we-license-games">how we license every game</a> for the full process
      behind calls like these.</p>
    `
  },
  'decluttering-the-genre-filter': {
    title: 'The homepage had two genre filters doing the exact same job',
    date: 'AUG 13, 2026',
    excerpt: 'A cleanup pass on browsing and discovery: one genre filter instead of two, related-game recommendations that are actually related, and a featured slot that finally rotates.',
    html: `
      <p>Sometimes the most useful change is subtraction. The homepage had two separate genre selectors
      stacked directly on top of each other, colorful icon chips right below the hero, then a second row
      of plain text buttons doing the identical job a few lines further down, both filtering the same
      grid. It's the kind of thing that's easy to stop seeing once it's shipped. It's gone now: the icon
      chips are the only genre filter, and they now show a live count per genre, like PUZZLE (8), so you
      know how much is actually in a category before you click into it.</p>
      <p>Two smaller fixes came out of the same pass. Every game page has a "More Games" row at the
      bottom, and it turned out to be picking its four suggestions by raw file order, meaning a Snake page
      could recommend 2048 and JS Racer ahead of anything actually similar. It now prefers same-genre
      picks first and only backfills with the rest of the catalog when a genre is thin, and the row's own
      label updates to match, "MORE ARCADE GAMES" instead of a generic "MORE GAMES" wherever that's true.
      Separately, the homepage's featured game slot had been hardcoded to whatever sits first in
      games.json since launch, permanently spotlighting the same game. It now rotates by calendar day, so
      the spotlight actually moves through the catalog instead of parking on one game forever.</p>
      <p>Neither of these needed a redesign, just someone actually looking at what was already there. The
      game grid also gets a small staggered fade-in now when it renders or re-filters, mostly because a
      static grid popping in flat felt off for a site built around old arcade cabinets.</p>
    `
  },
  'achievements-and-two-new-games': {
    title: 'Achievements, plus Pong and Tic-Tac-Toe join the vault',
    date: 'JUL 31, 2026',
    excerpt: 'Two new classics, one game that almost made it in but got pulled over a licensing conflict, and a new achievements page.',
    html: `
      <p>Two new games this round: Jake Gordon's <a href="game.html?id=pong">Pong</a>, the same
      developer behind JS Racer, and Mostafa Samir's <a href="game.html?id=tic-tac-toe">Tic-Tac-Toe</a>,
      which includes a minimax powered AI opponent with three difficulty levels, all the way up to a
      Master mode that plays mathematically perfect and can only ever be drawn, never beaten.</p>
      <p>A third candidate almost made it in: an HTML5 bubble shooter with a clean MIT license file at
      the root of its repository. Digging further, though, its actual game script carried its own
      copyright header explicitly licensing that specific file under the GPL instead, a direct conflict
      with the repo's own LICENSE file. Rather than guess which one actually governs the code, we
      dropped it. We'd rather ship fewer games than get a license wrong, and this is exactly why we check
      the header of the actual source file now, not just whatever license file sits at the top of a
      repository.</p>
      <p>Separately, there's now an <a href="leaderboards.html#achievements">achievements page</a> under
      Leaderboards: ten badges built entirely from stats this site was already quietly tracking in your
      browser, favorites, ratings, high scores, and play counts, so anyone who's already played a few
      rounds will find some of them unlocked the first time they check.</p>
    `
  },
  'mobile-support': {
    title: 'Neon Quarters now actually works on a phone',
    date: 'JUL 30, 2026',
    excerpt: 'Touch controls, a virtual d-pad for keyboard-only games, and a pass to make sure every game actually fits the screen it is on.',
    html: `
      <p>Most of these games were written years ago for a mouse and keyboard, long before anyone
      expected them to run on a phone. Getting them working properly on a touchscreen took more than a
      responsive layout: every game's canvas is now measured and scaled to fit its player frame instead
      of being cropped to a corner, which is what a fixed-pixel canvas from 2014 does by default on a
      screen it was never designed for.</p>
      <p>Touch itself needed real translation work too. A tap now behaves like a click, a drag behaves
      like a mouse drag for games like Classic Pool where aiming depends on it, and a long press acts as
      a right click, which matters specifically for flagging a tile in Minesweeper. For the handful of
      games that only ever listen for arrow keys or WASD, a virtual on-screen d-pad now appears on
      smaller screens and dispatches the same key events those games were already built to expect, so
      nothing had to be rewritten inside the games themselves.</p>
      <p>A couple of genuine bugs came out of testing this properly rather than just eyeballing it: ads
      were silently never loading the first time a new visitor accepted the cookie banner, only after a
      manual refresh, and Hangman had been rendering completely unstyled for every single visitor
      because of an absolute file path pointing at the wrong folder. Both are fixed now.</p>
    `
  },
  'welcome-to-neon-quarters': {
    title: 'Welcome to Neon Quarters',
    date: 'JUL 21, 2026',
    excerpt: 'Why we built another arcade site, what\'s in the vault at launch, and what\'s coming next.',
    html: `
      <p>Neon Quarters is a small, hand picked arcade of browser games you can play the moment
      the page loads. No installs, no plugins, no account. Some of it is old Flash era stuff
      brought back to life with <a href="https://ruffle.rs" target="_blank" rel="noopener">Ruffle</a>,
      and some of it is modern HTML5 built by developers who open sourced their work.</p>
      <p>The launch lineup is nine games across puzzle, arcade, shooter, racing, sports, and
      adventure: 2048, Canvas Tetris, 0h h1, JS Racer, Astray, Asteroids, Star Battle,
      Classic Pool, and Bullet Hell. Every one of them ships under a genuinely open license
      (MIT, CC0, or the Unlicense), with the original creator credited right on the play page.
      See <a href="licenses.html">Licenses &amp; Credits</a> for the full paper trail.</p>
      <p>This is meant to stay small and honest rather than grow fast. New games get added
      when we find ones worth adding, not on a schedule. If you've made or know of an openly
      licensed browser game that deserves a spot, the <a href="submit.html">submission form</a>
      is open.</p>
    `
  },
  'the-vault-just-grew': {
    title: 'The vault just grew: 12 new games',
    date: 'JUL 22, 2026',
    excerpt: 'From nine games to twenty one, with the same license and rights checks on every single one.',
    html: `
      <p>We said in the launch post that new games get added when we find ones worth adding,
      not on a schedule. This week we found twelve: Emoji Minesweeper, Fruit Matcher, Connect
      Four, Checkers, Hangman, Word Find, Reaction Time Tester, Lights Out, 15 Puzzle, Snake,
      Lunar Lander, and Typing Speed Test. That brings the vault to 21 games across nine
      genres, still all MIT, CC0, or Unlicense, still all credited on their own play page.</p>
      <p>A couple of these needed small changes before they were fit to publish, worth being
      upfront about. Checkers originally used a meme image of disputed authorship for its king
      piece; we swapped it for a plain crown. One minesweeper variant defaulted to loading
      emoji artwork from a third party CDN; we switched it to native emoji so the game does not
      depend on an external service at all.</p>
      <p>Two other games we looked at did not make the cut, and we would rather explain why than
      quietly skip them. One was a memory matching game whose code was open source but whose
      card images turned out to be lifted Super Mario sprites, someone else's IP, not covered by
      that license. We swapped in a fruit themed memory game instead. Another was a rhythm game
      built around a real, commercially released anime song with no license covering our use of
      it, so it never got downloaded in the first place. See
      <a href="blog-post.html?slug=how-we-license-games">how we license every game</a> for the full process behind
      calls like these.</p>
    `
  },
  'how-we-license-games': {
    title: 'How we license every game',
    date: 'MAR 20, 2026',
    excerpt: 'Our CC0/MIT vetting process, and why "the code is open source" isn\'t always the whole story.',
    html: `
      <p>Every game on this site is used under a permissive open license: MIT, CC0, or the
      Unlicense. That's a promise worth being precise about, so here's the actual process
      instead of a vague assurance.</p>
      <p>For each game, we check the license directly against the project's own repository
      metadata rather than trusting a listing site's tag. Where a repo is a mirror or fork of
      someone else's original work, we dig into the README to find and credit the actual
      original creator. 0h h1's code lives in a few different repos, for example, but the
      game itself was designed by the Dutch studio Q42, and that's who gets the credit line.</p>
      <p>License and trademark are two different questions, and we check both. A game's source
      code can be openly licensed while its name or characters still belong to someone else,
      so alongside the license check, we also look for that kind of trademark risk and skip or
      rework anything that raises one, even if the code itself would technically be fine to use.</p>
      <p>The result is on every game's play page: genre, exact license, original creator, and a
      link back to the source. If you're submitting a game, that's exactly what we'll ask you
      to provide. See the <a href="submit.html">submission form</a>.</p>
    `
  }
};

function getParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}

if (post) {
  document.title = `Neon Quarters Blog: ${post.title}`;
  document.getElementById('pageTitle').textContent = document.title;
  document.getElementById('ogTitle').content = document.title;
  document.getElementById('ogDescription').content = post.excerpt;
  document.getElementById('twitterTitle').content = document.title;
  document.getElementById('twitterDescription').content = post.excerpt;
  body.innerHTML = `
    <span class="post-date">${post.date}</span>
    <h1 style="font-size:1.15rem; margin:0.5rem 0 1.25rem;">${post.title}</h1>
    <div style="color:var(--text-dim); font-size:0.85rem; line-height:1.8; display:flex; flex-direction:column; gap:1rem;">
      ${post.html}
    </div>
  `;
} else {
  body.innerHTML = `
    <h1 style="font-size:1.1rem;">Post not found</h1>
    <p style="color:var(--text-dim); font-size:0.85rem;">That post doesn't exist. Head back to the <a href="blog.html">blog</a>.</p>
  `;
}
</script>
